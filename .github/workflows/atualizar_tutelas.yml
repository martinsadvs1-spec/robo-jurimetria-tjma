name: Atualizar Tutelas DataJud

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install pandas requests

      - name: Consultar DataJud
        env:
          DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY }}
        run: |
          python atualizar_tutelas.py

      - name: Mostrar resultado
        run: |
          echo "Arquivos gerados:"
          ls -lh
          echo "Prévia:"
          head -20 primeira_decisao_tutela_atualizada.csv

      - name: Salvar CSV atualizado no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add primeira_decisao_tutela_atualizada.csv
          git diff --cached --quiet || git commit -m "Atualizar tutelas via DataJud"
          git push
